name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Install browser for booking flow
        run: npx playwright install --with-deps chromium

      - name: Browser + API + database flow
        run: |
          npm ci --prefix ../backend
          npm run test:e2e
          npm run test:pilot

      - name: Booking screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-flow-screenshots
          path: |
            frontend/test-results/reservation-flow
            frontend/test-results/pilot-flow
