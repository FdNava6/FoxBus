services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-change-me-root}"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      DEMO_PAYMENTS: "false"
      DEV_MAILBOX: "false"
      SEED_DEMO_DATA: "false"
      TRUST_PROXY: "true"
    volumes:
      - backup-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
volumes:
  backup-data:
  mysql-data:
